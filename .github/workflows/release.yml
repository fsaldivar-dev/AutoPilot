name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version bump
        id: bump
        run: |
          LABELS='${{ toJSON(github.event.pull_request.labels.*.name) }}'

          if echo "$LABELS" | grep -q '"major"'; then
            echo "type=major" >> $GITHUB_OUTPUT
          elif echo "$LABELS" | grep -q '"minor"'; then
            echo "type=minor" >> $GITHUB_OUTPUT
          elif echo "$LABELS" | grep -q '"patch"'; then
            echo "type=patch" >> $GITHUB_OUTPUT
          else
            echo "No version label found (major/minor/patch). Skipping release."
            echo "type=skip" >> $GITHUB_OUTPUT
          fi

      - name: Get latest tag
        if: steps.bump.outputs.type != 'skip'
        id: tag
        run: |
          LATEST=$(git tag --sort=-v:refname | head -n 1)
          if [ -z "$LATEST" ]; then
            LATEST="v0.0.0"
          fi
          echo "latest=$LATEST" >> $GITHUB_OUTPUT

      - name: Calculate next version
        if: steps.bump.outputs.type != 'skip'
        id: version
        run: |
          CURRENT="${{ steps.tag.outputs.latest }}"
          CURRENT="${CURRENT#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          case "${{ steps.bump.outputs.type }}" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          echo "next=$VERSION" >> $GITHUB_OUTPUT
          echo "Next version: $VERSION"

      - name: Run tests
        if: steps.bump.outputs.type != 'skip'
        run: cd cli && swift test

      - name: Build universal binaries (auto + autopilotd)
        if: steps.bump.outputs.type != 'skip'
        run: |
          cd cli
          swift build -c release --arch arm64
          swift build -c release --arch x86_64
          lipo -create \
            .build/arm64-apple-macosx/release/auto \
            .build/x86_64-apple-macosx/release/auto \
            -output ../auto-universal
          lipo -create \
            .build/arm64-apple-macosx/release/autopilotd \
            .build/x86_64-apple-macosx/release/autopilotd \
            -output ../autopilotd-universal
          cd ..
          chmod +x auto-universal autopilotd-universal

      - name: Build XCTest runner bundle
        if: steps.bump.outputs.type != 'skip'
        run: |
          # Pick first available iPhone simulator
          UDID=$(xcrun simctl list devices available -j | \
            jq -r '.devices | to_entries | map(.value[]) | flatten[] | select(.name | contains("iPhone")) | .udid' | \
            head -1)
          echo "Using simulator: $UDID"

          cd "Demo/iOS/Test Automatitacion"
          xcodebuild build-for-testing \
            -project "Test Automatitacion.xcodeproj" \
            -scheme "Test Automatitacion" \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath ./DerivedData \
            | tail -10

          RUNNER_APP=$(find ./DerivedData/Build/Products -name "*UITests-Runner.app" -type d | head -1)
          XCTESTRUN=$(find ./DerivedData/Build/Products -name "*.xctestrun" | head -1)

          cd ../../..
          mkdir -p runner-bundle
          cp -R "$RUNNER_APP" runner-bundle/
          cp "$XCTESTRUN" runner-bundle/
          tar -czf autopilot-runner.tar.gz -C runner-bundle .
          ls -lh autopilot-runner.tar.gz

      - name: Generate checksums
        if: steps.bump.outputs.type != 'skip'
        run: |
          shasum -a 256 auto-universal autopilotd-universal autopilot-runner.tar.gz > checksums.txt
          cat checksums.txt

      - name: Create release
        if: steps.bump.outputs.type != 'skip'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.next }}"
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_BODY="${{ github.event.pull_request.body }}"

          gh release create "$VERSION" \
            --title "$VERSION — $PR_TITLE" \
            --notes "## Changes

          $PR_BODY

          ## Installation

          \`\`\`bash
          # Download CLI binaries
          curl -L https://github.com/${{ github.repository }}/releases/download/${VERSION}/auto-universal -o auto
          curl -L https://github.com/${{ github.repository }}/releases/download/${VERSION}/autopilotd-universal -o autopilotd
          chmod +x auto autopilotd
          sudo mv auto autopilotd /usr/local/bin/

          # (Optional) Download XCTest runner bundle for NavBar SwiftUI support
          curl -L https://github.com/${{ github.repository }}/releases/download/${VERSION}/autopilot-runner.tar.gz -o runner.tar.gz
          mkdir -p \$HOME/.autopilot/runner && tar -xzf runner.tar.gz -C \$HOME/.autopilot/runner

          # Or build from source
          cd cli && swift build -c release
          \`\`\`

          ## Checksums
          \`\`\`
          $(cat checksums.txt)
          \`\`\`" \
            auto-universal autopilotd-universal autopilot-runner.tar.gz checksums.txt

      - name: Create labels if missing
        if: steps.bump.outputs.type != 'skip'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create major --color D93F0B --description "Major version bump (breaking changes)" --force
          gh label create minor --color 0E8A16 --description "Minor version bump (new features)" --force
          gh label create patch --color 1D76DB --description "Patch version bump (bug fixes)" --force
