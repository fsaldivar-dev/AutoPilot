name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    # macos-26 trae Xcode 26 por defecto. En macos-15 era Xcode 16.4, y esa
    # divergencia importaba: el formato .xctestrun v2 que exige Xcode 26 es lo
    # que genera RunnerInstaller, asi que validarlo en 16.4 no decia nada del
    # entorno de desarrollo real.
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # ── Cache SPM ─────────────────────────────────────
      - name: Cache Swift build
        uses: actions/cache@v4
        with:
          path: cli/.build
          key: swift-${{ hashFiles('cli/Sources/**/*.swift', 'cli/Package.swift') }}
          restore-keys: swift-

      # ── Build CLI + Boot Simulator in parallel ────────
      - name: Build CLI + Boot Simulator
        run: |
          # Start build in background
          # autopilotd viaja al lado de `auto`: el comando `daemon` lo busca en
          # el directorio del propio binario, no en el PATH.
          (cd cli && swift build -c release \
             && cp .build/release/auto ../auto \
             && cp .build/release/autopilotd ../autopilotd) &
          BUILD_PID=$!

          # Boot simulator while building
          DEVICE_UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.loads(sys.stdin.read())
          for runtime, devices in data['devices'].items():
            if 'iOS' in runtime:
              for d in devices:
                if d['isAvailable'] and 'iPhone' in d['name']:
                  print(d['udid'])
                  sys.exit(0)
          sys.exit(1)
          ")
          xcrun simctl boot "$DEVICE_UDID"
          echo "DEVICE_UDID=$DEVICE_UDID" >> $GITHUB_ENV
          open -a Simulator &

          # Wait for both to finish
          wait $BUILD_PID
          xcrun simctl bootstatus "$DEVICE_UDID"

          # Verify
          ./auto ping

      # ── Test image (1s) ───────────────────────────────
      - name: Setup
        run: |
          mkdir -p temp screenshots
          python3 -c "
          import struct, zlib
          def c(t,d): return struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff)
          w,h=200,200; r=b''
          for y in range(h): r+=b'\x00'+b'\xff\x96\x32\xff'*w
          open('temp/test-image.png','wb').write(b'\x89PNG\r\n\x1a\n'+c(b'IHDR',struct.pack('>IIBBBBB',w,h,8,6,0,0,0))+c(b'IDAT',zlib.compress(r))+c(b'IEND',b''))
          "

      # ── Motor XCUI: runner + daemon ───────────────────
      #
      # Sin esto el CI solo tenia el observer, que ve la geometria de SwiftUI
      # pero NO extrae el texto de los Text. Con los dos motores ciegos para el
      # texto, `waitFor "Camara lista"` no podia pasar — de ahi que E2E llevara
      # en rojo desde julio.
      - name: Build XCUI runner
        run: |
          cd "Demo/iOS/Test Automatitacion"
          xcodebuild build-for-testing \
            -project "Test Automatitacion.xcodeproj" \
            -scheme "Test Automatitacion" \
            -destination "platform=iOS Simulator,id=$DEVICE_UDID" \
            -derivedDataPath ./DerivedData \
            | tail -5

      - name: Install runner + start daemon
        run: |
          RUNNER_APP=$(find "Demo/iOS/Test Automatitacion/DerivedData/Build/Products" \
            -name "*UITests-Runner.app" -type d | head -1)
          echo "runner: $RUNNER_APP"

          ./auto runner install "$RUNNER_APP" --udid "$DEVICE_UDID"

          # --timeout 0: el runner no se apaga por inactividad. Sin esto se cae
          # entre pasos y las consultas siguientes degradan al observer.
          #
          # AUTOPILOT_RUNNER_TEST_ID ya no hace falta —el .xctestrun generado
          # lleva OnlyTestIdentifiers— pero se deja explicito para que el CI no
          # dependa de ese detalle.
          # nohup: el daemon tiene que sobrevivir al final de ESTE paso para que
          # los siguientes lo encuentren vivo.
          AUTOPILOT_RUNNER_TEST_ID="Test AutomatitacionUITests/AutoPilotRunnerTests/testServe" \
            nohup ./autopilotd start --udid "$DEVICE_UDID" --timeout 0 \
            > daemon.log 2>&1 &

          # El daemon NO arranca el runner al iniciar: lo hace al llegar el primer
          # comando. Un bucle esperando a que `status` diga "ready" no lo levanta
          # nunca — es lo que fallaba antes. `tree deep` fuerza el motor profundo
          # y con ello el cold boot (~30-45s), que se paga una sola vez aqui.
          if ./auto tree deep > /dev/null 2>&1; then
            echo "runner listo"
            ./autopilotd status --udid "$DEVICE_UDID"
          else
            echo "::warning::el runner no arranco; los pasos siguientes no tendran motor XCUI"
            ./autopilotd status --udid "$DEVICE_UDID" || true
            tail -20 daemon.log || true
          fi

      # ── Hardware: Biometric + Pasteboard ──────────────
      - name: "Test: Biometric + Pasteboard"
        run: ./auto run scripts/examples/hardware-test.auto

      # ── Camera: Build + Mock + Capture ────────────────
      - name: Cache CameraTestApp
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/CameraTestApp*
          key: camera-app-${{ hashFiles('Demo/iOS/CameraTestApp/**') }}
          restore-keys: camera-app-

      - name: "Test: Camera Mock E2E"
        run: |
          ./auto build \
            -project Demo/iOS/CameraTestApp/CameraTestApp.xcodeproj \
            -scheme CameraTestApp \
            -sdk iphonesimulator \
            -destination "id=$DEVICE_UDID"

          xcrun simctl privacy booted grant camera dev.autopilot.test.CameraTestApp
          APP=$(find ~/Library/Developer/Xcode/DerivedData/CameraTestApp*/Build/Products/Debug-iphonesimulator -name '*.app' -maxdepth 1)
          xcrun simctl install booted "$APP"

          # Con `simctl launch` la app arranca SIN observer, asi que el unico motor
          # que queda es XCUI. `auto launch --inject` inyecta el observer ademas de
          # la imagen, dando dos motores en vez de uno — y si el runner fallara, el
          # test todavia tendria una via.
          # Imagen VERSIONADA, no generada al vuelo: la asercion es por hash, y un
          # PNG hecho con zlib.compress puede dar bytes distintos segun la version
          # de zlib del runner. Los bytes de un archivo del repo no cambian nunca.
          ./auto launch dev.autopilot.test.CameraTestApp --inject "$(pwd)/scripts/demo-images/foto-1.jpg"
          ./auto run scripts/examples/camera-test.auto

      # ── Artifacts ─────────────────────────────────────
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: screenshots/
