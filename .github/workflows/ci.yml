name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: cd cli && swift build

      - name: Test
        run: cd cli && swift test

      - name: Build Release
        run: cd cli && swift build -c release
