name: AutoPilotCamera
options:
  bundleIdPrefix: dev.autopilot
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  AutoPilotCamera:
    type: application
    platform: macOS
    sources:
      - AutoPilotCamera
      - CameraExtension/CameraProvider.swift
      - CameraExtension/CameraDevice.swift
      - CameraExtension/CameraStream.swift
    info:
      path: AutoPilotCamera/Info.plist
    entitlements:
      path: AutoPilotCamera/AutoPilotCamera.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.autopilot.camera
        INFOPLIST_FILE: AutoPilotCamera/Info.plist
        CODE_SIGN_ENTITLEMENTS: AutoPilotCamera/AutoPilotCamera.entitlements
    frameworks:
      - CoreMediaIO
      - CoreMedia
      - CoreVideo
      - CoreImage
      - IOKit
