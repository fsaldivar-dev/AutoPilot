name: AutoPilotCamera
options:
  bundleIdPrefix: dev.autopilot
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  AutoPilotCamera:
    type: application
    platform: macOS
    sources:
      - AutoPilotCamera
    info:
      path: AutoPilotCamera/Info.plist
    entitlements:
      path: AutoPilotCamera/AutoPilotCamera.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.autopilot.camera
        INFOPLIST_FILE: AutoPilotCamera/Info.plist
        CODE_SIGN_ENTITLEMENTS: AutoPilotCamera/AutoPilotCamera.entitlements
        ENABLE_HARDENED_RUNTIME: true
    dependencies:
      - target: AutoPilotCameraExtension

  AutoPilotCameraExtension:
    type: system-extension
    platform: macOS
    sources:
      - CameraExtension
    info:
      path: CameraExtension/Info.plist
    entitlements:
      path: CameraExtension/CameraExtension.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.autopilot.camera.extension
        INFOPLIST_FILE: CameraExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: CameraExtension/CameraExtension.entitlements
        ENABLE_HARDENED_RUNTIME: true
        SYSTEM_EXTENSION_API_VERSION: "1"
    frameworks:
      - CoreMediaIO
      - CoreMedia
      - CoreVideo
      - CoreImage
      - IOKit
      - SystemExtensions
